name: Build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Smoke test public routes and optimized images
        run: npm run test:smoke
      - name: Install Chromium for accessibility audit
        run: npx playwright install --with-deps chromium
      - name: Check WCAG A/AA on bilingual civic pages
        run: npm run test:a11y
      - name: Check critical production dependency advisories
        run: npm audit --omit=dev --audit-level=critical

